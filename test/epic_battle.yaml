global parameters:
- parameter: Battle
  parameters:
  - parameter: hero
    parameters: 
    - parameter: name
      choices: [Peter, Susan, Edmund, Lucy]
    - parameter: weapon
      choices: [sword, axe, dagger, bow, crossbow]
  - parameter: villain
    parameters: 
    - parameter: name
      choices: [witch, ogre, cyclops, dragon]
    - parameter: weapon
      choices: [sword, axe, dagger, bow, crossbow, claws and teeth, mace]
    logic:
    - constraint: only ogres and cyclopes use mace
      expression: "'weapon' IS 'mace' => 'name' IN ['ogre', 'cyclops']"
    - constraint: dragons use only claws and teeth
      expression: "'name' IS 'dragon' => 'weapon' IS 'claws and teeth'"
    - constraint: Only dragons use claws and teeth
      expression: "'weapon' IS 'claws and teeth' => 'name' IS 'dragon'"
  - parameter: location
    choices: [desert, swamp, forest, castle]  
  logic:
  - constraint: Lucy not using axe agains ogre
    expression: "'hero::name' IS 'Lucy' AND 'villain::name' IS 'ogre' => 'hero::weapon' IS NOT 'axe'"

functions:
- function: standard battle
  parameters:
  - linked parameter: battle
    linked to: Battle
  - output parameter: outcome
    default value: villain wins
  logic:
  - assignment: Peter wins against cyclops that uses mace
    expression: "'battle::hero::name' IS 'Peter' AND 'battle::villain::name' IS 'cyclops' AND 'battle::villain::weapon' IS 'mace' => 'outcome'='hero wins'"
  - assignment: Edmund wins with a dragon in swamp
    expression: "'battle::hero::name' IS 'Edmund' AND 'battle::villain::name' IS 'dragon' AND 'battle::location' IS 'swamp' => 'outcome'='hero wins'"
  - assignment: Susan wins with bow in agains ogre
    expression: "'battle::hero::name' IS 'Susan' AND 'battle::hero::weapon' IS 'bow' AND 'battle::villain::name' IS 'ogre' => 'outcome'='hero wins'"
  - assignment: Lucy using dagger wins against witch 
    expression: "'battle::hero::name' IS 'Lucy' AND 'battle::villain::name' IS 'witch' AND 'battle::hero::weapon' IS 'dagger' => 'outcome'='hero wins'"

- function: hero-villain battle
  parameters:
  - linked parameter: battle
    linked to: Battle
  - output parameter: outcome
    default value: villain wins
  logic:
  - assignment: Peter wins with ogre
    expression: "'battle::hero::name' IS 'Peter' AND 'battle::villain::name' IS 'ogre' => 'outcome'='hero wins'"
  - assignment: Susan wins with cyclops
    expression: "'battle::hero::name' IS 'Susan' AND 'battle::villain::name' IS 'cyclops' => 'outcome'='hero wins'"
  - assignment: Edmund wins with witch
    expression: "'battle::hero::name' IS 'Edmund' AND 'battle::villain::name' IS 'witch' => 'outcome'='hero wins'"
  - assignment: Lucy wins with dragon
    expression: "'battle::hero::name' IS 'Lucy' AND 'battle::villain::name' IS 'dragon' => 'outcome'='hero wins'"